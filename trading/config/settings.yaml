# ============================================================
# ПАНЕЛЬ УПРАВЛЕНИЯ ЗАКАЗЧИКА
# Это единственный файл, который нужно редактировать руками.
# Каждый параметр снабжён комментарием с единицами измерения.
# Некорректное значение = отказ запуска с понятным сообщением.
# ============================================================

капитал:
  стартовая_сумма: 20000        # рублей
  валюта: RUB

режим: backtest                 # backtest | paper | live
                                # live включать только после 3 месяцев paper

риск:
  макс_доля_одной_позиции: 0.25       # 0.25 = 25% портфеля на одну бумагу
  макс_число_позиций: 4               # штук одновременно
  дневной_лимит_убытка: 0.03          # 0.03 = 3% — стоп торговли на день
  макс_просадка_от_пика: 0.15         # 0.15 = 15% — полная остановка системы
  макс_сумма_одной_заявки: 6000       # рублей, защита от бага в единицах
  макс_заявок_в_день: 8               # штук, защита от зацикливания

издержки:
  комиссия_брокера_пct: 0.05          # % от оборота сделки
  минимальная_комиссия_руб: 1.0       # рублей за сделку, если % вышел меньше
  комиссия_биржи_пct: 0.01            # % от оборота сделки
  половина_спреда_пct: 0.05           # % от оборота, платится на каждой стороне
  базовое_проскальзывание_пct: 0.05   # % от оборота при малой заявке
  коэффициент_влияния: 5.0            # добавка к проскальзыванию (в %)
                                      # на каждую единицу отношения
                                      # (сумма заявки / средний дневной оборот).
                                      # Пример: заявка 1% от оборота даёт
                                      # добавку 5.0 * 0.01 = 0.05%
  предупреждение_доля_adv: 0.01       # 0.01 = 1% от дневного оборота — предупреждение в лог
  отказ_доля_adv: 0.05                # 0.05 = 5% от дневного оборота — заявка отклоняется
  стресс_множитель: 1.0               # поставить 2.0 для стресс-теста издержек
  ндфл_ставка: 0.13                   # 0.13 = 13% с зафиксированной прибыли
  ставка_займа_шорт_годовых: 0.18     # 18% годовых — плата брокеру за заём
                                      # бумаг при короткой позиции (перенос
                                      # маржинальной позиции: ключевая + 2-6 пп).
                                      # Начисляется ежедневно на стоимость шорта.

бенчмарк:
  безрисковая_ставка: 0.1425          # ключевая ставка ЦБ, обновлять вручную
  инфраструктура_руб_год: 4800        # рублей в год на VPS и прочее

данные:
  каталог_кэша: data_cache            # папка со скачанными данными (Parquet)
  начало_истории: "2015-01-01"        # с какой даты качать свечи
  запросов_в_секунду: 3               # вежливость к API Мосбиржи, не увеличивать
  таймаут_секунд: 10                  # таймаут одного запроса
  число_ретраев: 5                    # повторы при сбое сети (задержка растёт вдвое)
  порог_скачка_цены: 0.35             # 0.35 = 35% — скачок цены за день,
                                      # после которого бумага помечается подозрительной
                                      # (возможен сплит) и исключается из бэктеста

  подтверждённые_события:             # Реальные рыночные обвалы, проверенные
                                      # ЧЕЛОВЕКОМ. Скачок цены в такую дату —
                                      # не сплит и не битые данные: бумага
                                      # остаётся в бэктесте. Указать «тикеры»
                                      # можно, чтобы ограничить событие
                                      # конкретными бумагами; без них событие
                                      # действует на весь рынок.
    - дата: "2022-02-24"
      причина: "Начало СВО — обвал всего фондового рынка (подтверждено заказчиком 23.07.2026)"

ml:
  enabled: false                      # НЕ ВКЛЮЧАТЬ до прохождения фазы 8 (см. ТЗ, раздел 24)
