# ============================================================
# ПРОФИЛЬ КРИПТОРЫНКА (спот, Bitfinex)
# Та же схема, что settings.yaml, но параметры криптовалютного рынка.
# Демонстрация переносимости: код не меняется, меняется только конфиг.
# ============================================================

капитал:
  стартовая_сумма: 250          # долларов (~эквивалент 20 000 ₽)
  валюта: USD

режим: backtest

риск:
  макс_доля_одной_позиции: 0.25       # 25% на одну монету
  макс_число_позиций: 6               # крипта дробная — можно шире диверсифицировать
  дневной_лимит_убытка: 0.15          # 15%: на крипте 3% срабатывало бы каждый день
  макс_просадка_от_пика: 0.40         # 40%: крипта регулярно даёт такие просадки
  макс_сумма_одной_заявки: 200        # долларов
  макс_заявок_в_день: 12

издержки:
  комиссия_брокера_пct: 0.10          # тейкер-комиссия биржи ~0,1% за сторону
  минимальная_комиссия_руб: 0.0       # на крипте нет минимальной комиссии
  комиссия_биржи_пct: 0.0             # уже включена в комиссию брокера
  половина_спреда_пct: 0.03           # BTC/ETH узко; альткоины шире
  базовое_проскальзывание_пct: 0.05
  коэффициент_влияния: 5.0
  предупреждение_доля_adv: 0.01
  отказ_доля_adv: 0.05
  стресс_множитель: 1.0
  ндфл_ставка: 0.13                   # 13% с прибыли (РФ облагает и крипту)
  ставка_займа_шорт_годовых: 0.18

бенчмарк:
  безрисковая_ставка: 0.045           # доходность стейблкоина/векселей ~4,5%
  инфраструктура_руб_год: 0           # публичные API бесплатны

данные:
  каталог_кэша: data_cache
  начало_истории: "2015-01-01"
  запросов_в_секунду: 2
  таймаут_секунд: 15
  число_ретраев: 5
  порог_скачка_цены: 0.80             # крипта реально ходит на десятки % в день;
                                      # 80% ловит только сбои данных, не крахи

ml:
  enabled: false
