[project]
name = "finbotgod-trading"
version = "0.1.0"
description = "Исследовательская торговая система для Мосбиржи (фазы 1–2: слой данных и модель издержек)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Часть II (ТЗ, раздел 25). Ставятся, но в торговом контуре при
# ml.enabled: false не импортируются. torch и hmmlearn — для ступени 3
# и детекции режимов, ставятся позже, по мере надобности.
ml = [
    "scikit-learn>=1.4",   # базовые модели, метрики, пайплайны
    "statsmodels>=0.14",   # тесты стационарности (Дики — Фуллер)
    "scipy>=1.11",         # статистика (дефлированный Шарп, KS-тест)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = { find = { include = ["trading*"] } }
